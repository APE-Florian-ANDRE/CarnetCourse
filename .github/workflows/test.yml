# Tests à chaque push et pull request (audit CODE-01) : rapides d'abord, puis la suite complète (navigateur Chromium).
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v4.2.2 (épinglé au SHA : une étiquette peut être redéplacée, pas un SHA)
        with:
          fetch-depth: 0   # progression.js et pref.js comparent à d'anciens commits (git show)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v4.1.0 (épinglé au SHA)
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund   # installe EXACTEMENT package-lock.json (reproductible)
      - run: npx playwright install --with-deps chromium
      - name: Fonctions générées à jour
        run: npm run build:api && git diff --exit-code -- api integrations/n8n/workflow-coach.json
      - name: Tests rapides
        run: npm run test:fast
      - name: Suite complète
        run: node tests/run-all.js --jobs=2

  # Couverture du code navigateur (public/*.js) : couverture V8 de Chromium agrégée par monocart (la couverture des tests du
  # moteur de plan, qui chargent une copie d'app.js, est remappée sur l'original). Gate à 80 % sur la couverture lignes standard
  # (lcov/istanbul ; baseline ~88 %). Job séparé : la correction des tests reste jugée par « tests ».
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2 (épinglé au SHA)
        with:
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af   # v4.1.0 (épinglé au SHA)
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Couverture (échoue sous COV_MIN, défaut 80 %)
        run: npm run coverage
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882   # v4.4.3 (épinglé au SHA)
        if: always()
        with:
          name: coverage
          path: |
            coverage
            !coverage/.v8
          retention-days: 14
